---
- name: Installer PostgreSQL pour le catalogue Bacula
  become: true
  apt:
    name:
      - postgresql
      - postgresql-client
    state: present
    update_cache: true
    install_recommends: false

- name: Initialiser la base de catalogue Bacula
  become: true
  shell: |
    sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname = 'bacula'" | grep -q 1 || sudo -u postgres psql -c "CREATE USER bacula WITH PASSWORD 'ijkdFvTmjO3V';"
    sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'bacula'" | grep -q 1 || sudo -u postgres psql -c "CREATE DATABASE bacula OWNER bacula;"


- name: Installer Bacula Director et outils
  become: true
  apt:
    name:
      - bacula-director
      - bacula-console
      - bacula-common
    state: present
    update_cache: true
    install_recommends: false

- name: S'assurer que le service Bacula Director est actif
  become: true
  service:
    name: bacula-director.service
    state: started
    enabled: true

