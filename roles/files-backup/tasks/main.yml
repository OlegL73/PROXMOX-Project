
- name: Ensure files backup folder
  ansible.builtin.file:
    path: "/mnt/backup/files/{{ inventory_hostname }}"
    state: directory
    mode: '0750'
  become: true

- name: Deploy files backup script
  ansible.builtin.template:
    src: files_backup.sh.j2
    dest: /usr/local/sbin/files_backup.sh
    mode: '0750'

- name: Cron files backup (daily)
  ansible.builtin.cron:
    name: "Files backup"
    minute: "30"
    hour: "0"
    user: root
    job: "/usr/local/sbin/files_backup.sh"

- name: Deploy files verify script
  ansible.builtin.template:
    src: files_verify_restore.sh.j2
    dest: /usr/local/sbin/files_verify_restore.sh
    mode: '0750'

- name: Cron files verify (daily)
  ansible.builtin.cron:
    name: "Files restore verification"
    minute: "30"
    hour: "2"
    user: root
    job: "/usr/local/sbin/files_verify_restore.sh"
