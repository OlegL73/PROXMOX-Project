
---
- name: Stop MariaDB
  ansible.builtin.service:
    name: mariadb
    state: stopped

- name: Ensure binlog config exists (safe append)
  ansible.builtin.blockinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    block: |
      [mysqld]
      server-id=1
      log_bin = /var/lib/mysql/binlog
      binlog_format = ROW
      expire_logs_days = 7
      max_binlog_size = 100M

- name: Start MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
  notify: restart mariadb
