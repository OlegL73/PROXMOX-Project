---
- name: Arreter le service bind9 (si present)
  become: true
  service:
    name: bind9
    state: stopped
    enabled: false
  ignore_errors: true

- name: Supprimer les paquets DNS (bind9 + outils)
  become: true
  apt:
    name:
      - bind9
      - bind9utils
      - bind9-dnsutils
      - bind9-host
    state: absent
    purge: true
    autoremove: true
    update_cache: true

- name: Supprimer le dossier de configuration /etc/bind
  become: true
  file:
    path: /etc/bind
    state: absent

- name: Nettoyer le cache de bind /var/cache/bind
  become: true
  file:
    path: /var/cache/bind
    state: absent
