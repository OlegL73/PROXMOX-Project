
---
# Installer MariaDB
- name: Installer MariaDB server (paquet)
  ansible.builtin.package:
    name: mariadb-server
    state: present
  become: true

# Déterminer le service réellement présent (mariadb ou mysql)
- name: Collecter les services présents
  ansible.builtin.service_facts:

- name: Choisir le nom de service actif pour MariaDB/MySQL
  ansible.builtin.set_fact:
    mariadb_active_service: >-
      {{ (mariadb_possible_services | select('in', services.keys()) | list | first) | default('mariadb') }}

# Déployer la configuration MariaDB (bind-address)
- name: Déployer la configuration MariaDB (bind-address)
  ansible.builtin.template:
    src: mariadb.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/60-bind.cnf
    owner: root
    group: root
    mode: '0644'
  notify: restart_db
  become: true

# Activer et démarrer le service (de façon tolérante)
- name: Activer et démarrer MariaDB/MySQL (tolérant)
  ansible.builtin.service:
    name: "{{ mariadb_active_service }}"
    enabled: true
    state: started
  ignore_errors: true
  become: true
  when: not ansible_check_mode

# (Facultatif) Vérifier l’ouverture du port sans faire échouer le play
- name: Vérifier que MariaDB écoute sur {{ mariadb_bind_address }}:{{ mariadb_port }}
  ansible.builtin.wait_for:
    host: "{{ mariadb_bind_address }}"
    port: "{{ mariadb_port }}"
    delay: 5
    timeout: 60
  ignore_errors: true
  become: true
  when: not ansible_check_mode

